[package]
name = "moerae"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/Akanoa/moerae"
authors = ["Yannick Guern"]
description = "AI memory system with put/search API and segment lifecycle"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
lru = "0.12"
llama-cpp-2 = "0.1"
usearch = { version = "2", default-features = false, features = ["fp16lib"] }
rustyline = { version = "15", features = ["with-file-history"] }
libc = "0.2"
ureq = "3"

[[bin]]
name = "moerae"
path = "src/bin/moerae.rs"

[[bin]]
name = "moerae-repl"
path = "src/bin/repl.rs"

[[bin]]
name = "moerae-bench"
path = "src/bin/bench.rs"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
